<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Ubani Wisdom - Frontend Developer building fast React and Tailwind websites."
    />
    <title>Ubani Wisdom – Frontend Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem("theme");
        if (
          t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
        )
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
